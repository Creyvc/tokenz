<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare · Tokenz</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="reload.js"></script>
  <script src="page-transition.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="consent.js" defer></script>
  <script src="modal.js" defer></script>
  <script src="api.js" defer></script>
  <script src="wake-slider.js" defer></script>
  <script src="compare.js" defer></script>
</head>
<body>
  <header class="nav">
    <a href="index.html" class="logo" aria-label="Tokenz home">
      <img src="assets/logo-mark.svg" alt="" width="48" height="48">
    </a>
    <nav class="nav-links">
      <a href="index.html" data-label="Home">Home</a>
      <a href="compare.html" class="active" data-label="Compare">Compare<span class="nav-dot"></span></a>
      <a href="results.html" data-label="Results">Results</a>
      <a href="how-it-works.html" data-label="How it works">How it works</a>
      <a href="about.html" data-label="About">About</a>
      <div class="nav-extra">
        <a href="info.html" data-modal="info" data-label="Info">Info</a>
        <a href="cookies.html" data-modal="cookies" data-label="Cookies">Cookies</a>
      </div>
    </nav>
    <div class="tz-lockup">
      <svg width="54" height="54" viewBox="0 0 64 64" role="img" aria-label="Squeeze mark"><path d="M6 14 H15 L25 32 L15 50 H6 L16 32 Z" fill="#16171A"></path><path d="M58 14 H49 L39 32 L49 50 H58 L48 32 Z" fill="#16171A"></path><path d="M32 27.5 L36.5 32 L32 36.5 L27.5 32 Z" fill="#16171A"></path></svg>
      <span class="tz-word">Tokenz</span><span class="tz-bar"></span><span class="tz-desc">Token saver</span>
    </div>
  </header>

  <main class="content workbench">
    <h1>Compare</h1>

    <div class="engine-notice" data-engine-notice hidden>
      <p data-engine-message></p>
      <button type="button" class="wb-secondary" data-engine-retry>Try again</button>
    </div>

    <form class="wb" data-workbench novalidate>
      <div class="wb-card">
        <div class="wb-card-head">
          <div class="wb-segmented" role="radiogroup" aria-label="Method">
            <label><input type="radio" name="method" value="nlp" checked><span>NLP</span></label>
            <label><input type="radio" name="method" value="tfidf"><span>TF-IDF</span></label>
            <label><input type="radio" name="method" value="ai"><span>AI rewrite</span></label>
          </div>
        </div>
        <!-- The prompt goes in like a chat message: the squeeze mark (assets/logo-mark.svg's own
             paths, inline so its parts can move while a run is going), the text, and a round send
             button, which runs the chosen method -->
        <div class="wb-composer" data-composer>
          <svg class="wb-mark" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><path class="wb-mark-l" d="M6 14 H15 L25 32 L15 50 H6 L16 32 Z"/><path class="wb-mark-r" d="M58 14 H49 L39 32 L49 50 H58 L48 32 Z"/><path class="wb-mark-d" d="M32 27.5 L36.5 32 L32 36.5 L27.5 32 Z"/></svg>
          <label class="wb-hidden-label" for="wb-prompt">Your prompt</label>
          <textarea id="wb-prompt" class="wb-prompt" rows="6" maxlength="40000" placeholder="Enter the prompt you want to optimize." data-prompt></textarea>
          <button type="submit" class="wb-send" data-run disabled aria-label="Run NLP" title="Run NLP">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
          </button>
        </div>
        <div class="wb-card-foot">
          <span class="wb-count" data-prompt-tokens></span>
          <span class="wb-foot-links">
            <button type="button" class="wb-link" data-clear hidden>Clear</button>
          </span>
        </div>
      </div>

      <section class="wb-settings" data-for="nlp">
        <h2 class="wb-section-title" id="wb-level-label">Strength</h2>
        <div class="wb-steps" role="radiogroup" aria-labelledby="wb-level-label">
          <label><input type="radio" name="level" value="conservative"><span><b>1</b>Conservative</span></label>
          <label><input type="radio" name="level" value="balanced"><span><b>2</b>Balanced</span></label>
          <label><input type="radio" name="level" value="aggressive"><span><b>3</b>Aggressive</span></label>
          <label><input type="radio" name="level" value="maximum"><span><b>4</b>Maximum</span></label>
        </div>
      </section>

      <section class="wb-settings" data-for="tfidf" hidden>
        <h2 class="wb-section-title" id="wb-sentences-label">Main task</h2>
        <ol class="wb-sentences" aria-labelledby="wb-sentences-label" data-sentences></ol>
        <h2 class="wb-section-title"><label for="wb-budget">How much to keep</label></h2>
        <div class="wb-budget-row">
          <div class="wb-range-wrap">
            <div class="wb-wake" data-budget-slider></div>
            <span class="wb-range-least" data-budget-least hidden></span>
          </div>
          <input id="wb-budget" class="wb-input wb-budget" type="number" min="1" max="6000" step="1" inputmode="numeric" data-budget>
          <span class="wb-unit">tokens</span>
        </div>
        <div class="wb-row-help">
          <p class="wb-help" data-budget-share></p>
          <button type="button" class="wb-link" data-suggest>Use suggested</button>
        </div>
        <ul class="wb-problems" data-problems></ul>
      </section>

      <section class="wb-settings" data-for="ai" hidden>
        <div class="wb-ai-status" data-ai-status></div>
      </section>

      <!-- Words that must come through exactly as written. NLP and TF-IDF only: the AI rewrite
           doesn't use them, so it's hidden there -->
      <section class="wb-settings" data-phrases-section>
        <h2 class="wb-section-title"><label for="wb-phrases">Protected phrases <span class="wb-optional">Optional</span></label></h2>
        <div class="wb-card wb-card-plain">
          <textarea id="wb-phrases" class="wb-prompt wb-phrases" rows="3" placeholder="Words to keep unchanged, one per line." data-phrases></textarea>
        </div>
      </section>

      <div class="wb-actions">
        <p class="wb-help" data-run-help></p>
        <p class="wb-shortcut" data-shortcut></p>
      </div>
    </form>

    <section class="wb-result" data-result aria-live="polite" hidden></section>
  </main>
</body>
</html>
