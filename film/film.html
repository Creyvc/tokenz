<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tokenz film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #000; }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; visibility: hidden; z-index: 2; }
  .mono { font-family: "JetBrains Mono", monospace; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
  .chev, #dia { position: absolute; left: 0; top: 0; overflow: visible; z-index: 40; transform-origin: 0 0; }
  #wipe { position: absolute; left: 0; top: 0; border-radius: 50%; z-index: 1; }
  .bt { display: inline-block; will-change: transform; }

  #a-word { position: absolute; left: 50%; top: 50%; font-weight: 800; font-size: 300px; color: #fff; white-space: nowrap; letter-spacing: -0.05em; line-height: 1; }

  #b-label { position: absolute; left: 50%; top: 250px; transform: translateX(-50%); color: #8a8a8a; font-size: 20px; }
  #b-num { position: absolute; left: 50%; top: 468px; font-weight: 800; font-size: 420px; color: #fff; line-height: 1; letter-spacing: -0.06em; white-space: nowrap; }
  #b-line { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-weight: 700; font-size: 84px; letter-spacing: -0.04em; color: #fff; white-space: nowrap; }
  #b-pill { position: absolute; left: 50%; top: 760px; font-size: 22px; background: #8B7FF2; color: #000; padding: 10px 16px 9px; letter-spacing: 0.12em; }

  /* a method: its name, a short line, then the numbers */
  .m-head { position: absolute; left: 0; top: 0; width: 1920px; text-align: center; transform-origin: 960px 0; }
  .m-title { font-weight: 800; font-size: 250px; letter-spacing: -0.055em; line-height: 1; white-space: nowrap; }
  .m-sub { margin-top: 26px; font-weight: 600; font-size: 56px; letter-spacing: -0.035em; white-space: nowrap; }
  .m-row { position: absolute; left: 0; right: 0; top: 470px; display: flex; justify-content: center; align-items: baseline; gap: 56px; font-weight: 800; font-size: 250px; letter-spacing: -0.06em; line-height: 1; white-space: nowrap; }
  .m-row .arrow { font-weight: 500; font-size: 150px; opacity: 0.4; }
  .m-foot { position: absolute; left: 0; right: 0; top: 790px; display: flex; justify-content: center; gap: 20px; align-items: center; font-size: 24px; white-space: nowrap; }
  .m-foot .pill { padding: 9px 14px 8px; }
  .m-checks { position: absolute; left: 0; right: 0; top: 520px; display: flex; justify-content: center; gap: 70px; font-weight: 700; font-size: 92px; letter-spacing: -0.04em; white-space: nowrap; }
  .m-checks .ck { color: #8B7FF2; margin-right: 18px; }

  /* results */
  #s-upto { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-weight: 600; font-size: 72px; letter-spacing: -0.04em; color: #16171A; }
  #s-num { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-weight: 800; font-size: 400px; letter-spacing: -0.065em; line-height: 1; color: #5B4FD6; }
  #s-sub { position: absolute; left: 0; right: 0; top: 660px; text-align: center; font-weight: 700; font-size: 84px; letter-spacing: -0.04em; color: #16171A; white-space: nowrap; }
  #s-row { position: absolute; left: 0; right: 0; top: 850px; display: flex; justify-content: center; gap: 80px; font-size: 24px; color: #5c5c5c; white-space: nowrap; }
  #s-row b { color: #16171A; font-family: "Inter", sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.03em; margin-left: 14px; }

  /* the line */
  #f-l1, #f-l2 { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 170px; letter-spacing: -0.055em; line-height: 1; white-space: nowrap; color: #fff; }
  #f-l1 { top: 340px; } #f-l2 { top: 520px; color: #8B7FF2; }

  #g-word { position: absolute; top: 50%; font-weight: 700; font-size: 190px; color: #fff; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; }
  #g-word span { display: inline-block; }
  #g-tag { position: absolute; left: 50%; top: 680px; color: #8a8a8a; font-size: 20px; white-space: nowrap; }
  #g-tag b { color: #8B7FF2; font-weight: 500; }
</style>
</head>
<body>
<div id="stage">
  <div id="wipe"></div>

  <div class="scene" id="A"><div id="a-word"></div></div>

  <div class="scene" id="B">
    <div id="b-label" class="mono">Tokens</div>
    <div id="b-num">28</div>
    <div id="b-line"><span class="bt" id="bw0">Every</span> <span class="bt" id="bw1">word</span> <span class="bt" id="bw2" style="color:#8B7FF2">costs.</span></div>
    <div id="b-pill" class="mono">−71%</div>
  </div>

  <div class="scene" id="NLP"></div>
  <div class="scene" id="TF"></div>

  <div class="scene" id="AI">
    <div class="m-head" id="ai-head" style="color:#fff"><div class="m-title bt" id="ai-title">AI Rewrite</div><br><div class="m-sub bt" id="ai-sub">Rewrites it shorter. Then checks it.</div></div>
    <div class="m-checks" style="color:#fff"><span class="bt" id="ai-c0"><span class="ck">✓</span>Numbers</span><span class="bt" id="ai-c1"><span class="ck">✓</span>Limits</span><span class="bt" id="ai-c2"><span class="ck">✓</span>“Not”</span></div>
  </div>

  <div class="scene" id="RES">
    <div id="s-upto"><span class="bt" id="s-w0">Up to</span></div>
    <div id="s-num"><span class="bt" id="s-w1">69%</span></div>
    <div id="s-sub"><span class="bt" id="s-w2">fewer</span> <span class="bt" id="s-w3">tokens.</span></div>
    <div id="s-row" class="mono"><span class="bt" id="s-r0">NLP<b>52%</b></span><span class="bt" id="s-r1">TF‑IDF<b>48%</b></span><span class="bt" id="s-r2">AI Rewrite<b>69%</b></span></div>
  </div>

  <div class="scene" id="LINE">
    <div id="f-l1"><span class="bt" id="f-w0">Shorter</span> <span class="bt" id="f-w1">prompts,</span></div>
    <div id="f-l2"><span class="bt" id="f-w2">Same</span> <span class="bt" id="f-w3">request.</span></div>
  </div>

  <div class="scene" id="G">
    <div id="g-word"></div>
    <div id="g-tag" class="mono">Token saver <b>·</b> tokenz</div>
  </div>

  <svg class="chev" id="chev-l" viewBox="0 0 19 36" width="19" height="36"><path d="M0 0 H9 L19 18 L9 36 H0 L10 18 Z"/></svg>
  <svg class="chev" id="chev-r" viewBox="0 0 19 36" width="19" height="36"><path d="M19 0 H10 L0 18 L10 36 H19 L9 18 Z"/></svg>
  <svg id="dia" viewBox="-1 -1 2 2" width="2" height="2"><path d="M0 -1 L1 0 L0 1 L-1 0 Z"/></svg>
</div>

<script>
// The film, drawn from the time t alone, every change on a hit of the music. The hit times
// were measured from the edited track itself (film seconds).
const DUR = 30.0;
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const outExpo = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const inExpo = (k) => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10));
const outCubic = (k) => 1 - Math.pow(1 - k, 3);
const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const outBack = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const W = 1920, H = 1080, CX = 960, CY = 540;
const INK = "#16171A", VIOLET = "#8B7FF2", DVIOLET = "#5B4FD6", LIGHT = "#F4F4F1";

// ---------- the music ----------
const PULSES = [0.253, 0.725, 1.197, 1.671, 2.143, 2.617, 2.853];      // the build
const Q = (k) => 3.089 + k * 0.47233;                                    // beats from the drop to the silence
const ROLL = [6.997, 7.351, 7.707, 8.061, 8.533, 8.756, 8.993];          // the fill before the silence
const SLAM = 9.17;                                                       // the last hit before the silence
const HITS = [10.619, 10.835, 11.335, 11.815, 12.059, 12.539, 12.777, 13.255, 13.739, 13.983, 14.463,
  14.701, 15.179, 15.659, 16.019, 16.383, 16.621, 17.099, 17.579, 17.939, 18.303, 19.019, 19.499, 19.859,
  20.223, 20.461, 20.939, 21.421, 21.781, 22.381, 22.861, 23.341, 23.701, 24.063, 24.301, 24.781, 25.261,
  25.621, 25.985, 26.221, 26.699, 27.149];
const h = (i) => HITS[i];
const STOP = 26.75, HIT = 27.149;

// ---------- the chevrons ----------
function markState(x, y, size, open = 0) { const u = size / 64; return { lx: x - (7 + open) * u, rx: x + (7 + open) * u, y, h: 36 * u }; }
function mix(a, b, k) { return { lx: lerp(a.lx, b.lx, k), rx: lerp(a.rx, b.rx, k), y: lerp(a.y, b.y, k), h: lerp(a.h, b.h, k) }; }
function around(el, pad = 44, hs = 1, minH = 0) { const r = el.getBoundingClientRect(); return { lx: r.left - pad, rx: r.right + pad, y: r.top + r.height / 2, h: Math.max(minH, r.height * hs) }; }
// round the words that are showing inside a full-width line (or lines)
function aroundWords(els, pad = 44, hs = 1) {
  let l = Infinity, r = -Infinity, t = Infinity, b = -Infinity;
  els.forEach((line) => [...line.querySelectorAll(".bt")].forEach((w) => {
    if (parseFloat(w.style.opacity || "1") < 0.05) return;
    const q = w.getBoundingClientRect(); l = Math.min(l, q.left); r = Math.max(r, q.right); t = Math.min(t, q.top); b = Math.max(b, q.bottom);
  }));
  if (l === Infinity) { const q = els[0].getBoundingClientRect(); return { lx: CX - 120, rx: CX + 120, y: q.top + q.height / 2, h: q.height * hs }; }
  return { lx: l - pad, rx: r + pad, y: (t + b) / 2, h: (b - t) * hs };
}
function drawChev(c, color = "#fff", alpha = 1, blur = 0) {
  const u = c.h / 36, l = $("chev-l"), r = $("chev-r");
  l.style.transform = `translate(${c.lx - 19 * u}px, ${c.y - 18 * u}px) scale(${u})`;
  r.style.transform = `translate(${c.rx}px, ${c.y - 18 * u}px) scale(${u})`;
  [l, r].forEach((s) => { s.style.fill = color; s.style.opacity = alpha; s.style.filter = blur > 0.3 ? `blur(${blur / u}px)` : "none"; });
}
function drawDia(x, y, r, spin = 0, color = "#fff") {
  $("dia").style.transform = `translate(${x}px, ${y}px) rotate(${spin}deg) scale(${Math.max(r, 0.0001)}) translate(-1px, -1px)`;
  $("dia").style.fill = color; $("dia").style.opacity = r > 0.01 ? 1 : 0;
}
function wipe(x, y, k, color) {
  const el = $("wipe");
  if (k <= 0) { el.style.display = "none"; return 0; }
  const r = Math.hypot(Math.max(x, W - x), Math.max(y, H - y)) * 1.02 * k;
  el.style.display = "block"; el.style.width = el.style.height = 2 * r + "px";
  el.style.transform = `translate(${x - r}px, ${y - r}px)`; el.style.background = color;
  return r;
}
// a kick on each hit: the chevrons spring out a touch and settle
function kick(t, times, amt = 16) { let b = 0; times.forEach((s) => { if (t >= s) b += Math.exp(-(t - s) * 14) * amt; }); return b; }
function spring(c, b) { return { ...c, lx: c.lx - b, rx: c.rx + b }; }

const REST_SIZE = 150, END_SIZE = 200;
const OFF = { lx: -320, rx: W + 320, y: CY, h: 300 };
const sceneIds = ["A", "B", "NLP", "TF", "AI", "RES", "LINE", "G"];
function show(id) { sceneIds.forEach((s) => ($(s).style.visibility = s === id ? "visible" : "hidden")); }

// a word or number landing on its hit: in from a little bigger and blurred, settled in 0.2 s
function slam(el, t, at, from = 1.25) {
  const k = prog(t, at, 0.2), e = outExpo(k);
  el.style.opacity = t < at ? 0 : clamp(k * 4);
  el.style.transform = `scale(${lerp(from, 1, e)})`;
  el.style.filter = t >= at && k < 1 ? `blur(${(1 - e) * 10}px)` : "none";
}
// a word rising into place on its hit
function rise(el, t, at) {
  const k = prog(t, at, 0.28), e = outExpo(k);
  el.style.opacity = t < at ? 0 : clamp(k * 3);
  el.style.transform = `translateY(${(1 - e) * 50}px)`;
  el.style.filter = "none";
}

// ---------- the two number scenes (NLP, TF-IDF) ----------
const METHODS = {
  NLP: { name: "NLP", line: "Tidies the wording.", a: "41", b: "26", save: "−37%", bg: LIGHT, fg: INK, accent: DVIOLET, pillBg: DVIOLET, pillFg: "#fff", at: 1 },
  TF: { name: "TF‑IDF", line: "Keeps what's on topic.", a: "74", b: "43", save: "−42%", bg: DVIOLET, fg: "#fff", accent: "#fff", pillBg: "#000", pillFg: "#fff", at: 9 },
};
function buildMethod(id) {
  const m = METHODS[id], sc = $(id);
  sc.innerHTML = `
    <div class="m-head" id="${id}-head" style="color:${m.fg}"><div class="m-title bt" id="${id}-title">${m.name}</div><br><div class="m-sub bt" id="${id}-sub">${m.line}</div></div>
    <div class="m-row" id="${id}-row" style="color:${m.fg}"><span class="bt" id="${id}-a">${m.a}</span><span class="bt arrow" id="${id}-ar">→</span><span class="bt" id="${id}-b" style="color:${m.accent}">${m.b}</span></div>
    <div class="m-foot mono" style="color:${m.fg}"><span class="bt" id="${id}-u">Tokens</span><span class="bt pill" id="${id}-p" style="background:${m.pillBg};color:${m.pillFg}">${m.save}</span></div>`;
}
// beat by beat: name, line, (head goes up) first number, arrow, second number, "tokens", saving
function drawMethod(id, t) {
  const m = METHODS[id], i = m.at;
  const head = $(id + "-head");
  const up = outExpo(prog(t, h(i + 2), 0.35));
  head.style.top = lerp(300, 120, up) + "px";
  head.style.transform = `scale(${lerp(1, 0.5, up)})`;
  slam($(id + "-title"), t, h(i));
  rise($(id + "-sub"), t, h(i + 1));
  slam($(id + "-a"), t, h(i + 2));
  slam($(id + "-ar"), t, h(i + 3), 1.1);
  $(id + "-ar").style.opacity = parseFloat($(id + "-ar").style.opacity) * 0.4;
  slam($(id + "-b"), t, h(i + 4), 1.5);
  rise($(id + "-u"), t, h(i + 5));
  slam($(id + "-p"), t, h(i + 6), 1.6);
  // the chevrons: round the name, then round the numbers, a kick on every hit
  const onName = around($(id + "-title"), 50, 1.1);
  const onRow = aroundWords([$(id + "-row")], 50, 0.95);
  const c = mix(onName, onRow, outExpo(prog(t, h(i + 2), 0.3)));
  return spring(c, kick(t, [h(i), h(i + 1), h(i + 2), h(i + 3), h(i + 4), h(i + 5), h(i + 6), h(i + 7)]));
}

function build() {
  buildMethod("NLP"); buildMethod("TF");
  $("g-word").innerHTML = "Tokenz".split("").map((c) => `<span>${c}</span>`).join("");
  const m = document.createElement("span");
  m.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font-family:Inter;font-weight:700;font-size:190px;letter-spacing:-0.05em";
  m.textContent = "Tokenz"; document.body.appendChild(m); window.GW = m.getBoundingClientRect().width; m.remove();
}

// ---------- the timeline ----------
function render(tIn) {
  const t = clamp(tIn, 0, DUR - 1e-6);
  const st = $("stage");
  wipe(0, 0, 0);

  // ===== the build: the logo opens on the first pulse; a filler word on every pulse =====
  if (t < Q(0)) {
    show("A"); st.style.background = "#000";
    const b0 = PULSES[0] - 0.1;
    const burst = prog(t, b0, 0.36);
    drawChev(mix(markState(CX, CY, REST_SIZE), OFF, inExpo(burst)), "#fff", 1, 24 * Math.sin(Math.PI * burst));
    drawDia(CX, CY, 10.55 * (1 - outCubic(prog(t, b0, 0.22))), 180 * outCubic(prog(t, b0, 0.3)));
    const words = ["Hey!", "Hope", "you're", "doing", "well.", "Could you", "please…"];
    let i = -1; PULSES.forEach((p, k) => { if (t >= p) i = k; });
    const w = $("a-word");
    if (i >= 0) {
      const k = prog(t, PULSES[i], 0.16);
      w.textContent = words[i];
      w.style.opacity = clamp(k * 4);
      w.style.color = i >= 5 ? "#fff" : "#d8d8d8";
      let tr = `translate(-50%, -52%) scale(${lerp(1.3, 1, outExpo(k))})`;
      w.style.filter = `blur(${lerp(10, 0, outExpo(k))}px)`;
      if (i === words.length - 1) { const c = inExpo(prog(t, Q(0) - 0.14, 0.14)); tr = `translate(-50%, -52%) scale(${lerp(1, 0.02, c)}, ${lerp(1, 0.06, c)})`; }
      w.style.transform = tr;
    } else w.style.opacity = 0;
    return;
  }

  // ===== the drop: 28. "Every" "word" "costs." one per beat. Then the chevrons squeeze it a
  // notch on every beat, faster through the fill, and crush it to 8 on the last hit =====
  if (t < HITS[0] + 0.2) {
    show("B"); st.style.background = "#000";
    const n = $("b-num");
    const after = t >= SLAM;
    // every squeeze: the chevrons step in, and the number gets narrower
    const steps = [Q(4), Q(5), Q(6), Q(7), ...ROLL];
    let done = 0;
    steps.forEach((s) => { if (t >= s) done += outExpo(prog(t, s, 0.14)); });
    const squeeze = done / (steps.length + 1);
    const grow = outExpo(prog(t, Q(0), 0.2));
    const hit = prog(t, SLAM, 0.45);
    n.textContent = after ? "8" : "28";
    n.style.color = after ? VIOLET : "#fff";
    let sx = lerp(1, 0.62, squeeze), sy = lerp(1, 1.06, squeeze);
    if (after) { sx = lerp(0.6, 1, outBack(hit)); sy = lerp(1.15, 1, outBack(hit)); }
    // a little punch on each beat while it waits for the squeeze
    const pulse = kick(t, [Q(1), Q(2), Q(3)], 0.035);
    const leave = prog(t, HITS[0], 0.25);
    n.style.transform = `translate(-50%, -50%) scale(${lerp(1.3, 1, grow) * sx * (1 + pulse) * (1 - 0.8 * leave)}, ${lerp(1.3, 1, grow) * sy * (1 + pulse) * (1 - 0.8 * leave)})`;
    n.style.filter = t < Q(0) + 0.2 ? `blur(${(1 - grow) * 12}px)` : "none";
    n.style.opacity = 1 - leave;
    $("b-label").style.opacity = after ? 0 : grow;
    // "Every word costs." one word per beat, gone when the squeezing starts
    ["bw0", "bw1", "bw2"].forEach((id, k) => {
      rise($(id), t, Q(1 + k));
      if (t > Q(4)) { const o = prog(t, Q(4), 0.2); $(id).style.opacity = 1 - o; $(id).style.transform = `translateY(${o * 40}px)`; }
    });
    const pk = prog(t, SLAM + 0.15, 0.35);
    $("b-pill").style.opacity = clamp(pk * 3) * (1 - leave);
    $("b-pill").style.transform = `translate(-50%, ${lerp(30, 0, outExpo(pk))}px) scale(1.6)`;
    // the chevrons
    const wide = { lx: CX - 360, rx: CX + 360, y: 468, h: 169 };
    const tight = { lx: CX - 155, rx: CX + 155, y: 468, h: 169 };
    let c = mix({ ...OFF, y: 468, h: 169 }, wide, outExpo(prog(t, Q(4) - 0.06, 0.2)));
    c = mix(c, { lx: CX - 210, rx: CX + 210, y: 468, h: 169 }, squeeze);
    if (t >= SLAM - 0.06) c = mix(c, tight, outExpo(prog(t, SLAM - 0.06, 0.1)));
    if (after) { const bb = 12 * Math.sin(Math.PI * prog(t, SLAM, 0.18)); c = { ...tight, lx: tight.lx + bb, rx: tight.rx - bb }; }
    // after the silence: light floods out of the 8, the chevrons go round "NLP"
    const r = wipe(CX, 468, outExpo(prog(t, HITS[0], 0.25)), LIGHT);
    if (t >= HITS[0]) {
      const nameBox = { lx: CX - 330, rx: CX + 330, y: 425, h: 300 };
      c = mix(c, nameBox, outExpo(prog(t, HITS[0], 0.3)));
    }
    drawChev(c, r > 260 ? INK : "#fff", t >= Q(4) - 0.1 ? 1 : 0, t < Q(4) + 0.15 ? 14 * Math.sin(Math.PI * prog(t, Q(4) - 0.06, 0.2)) : 0);
    drawDia(0, 0, 0);
    return;
  }

  // ===== NLP, then TF-IDF (the cut lands on its hit) =====
  if (t < h(17)) {
    const id = t < h(9) ? "NLP" : "TF";
    show(id); st.style.background = METHODS[id].bg;
    let c = drawMethod(id, t);
    // the glide from one to the next
    if (id === "TF" && t < h(9) + 0.3) { show("NLP"); const prev = drawMethod("NLP", h(9) - 0.001); show("TF"); drawMethod("TF", t); c = mix(prev, c, outExpo(prog(t, h(9), 0.3))); }
    if (id === "NLP" && t < h(1) + 0.3) c = mix({ lx: CX - 330, rx: CX + 330, y: 425, h: 300 }, t < h(1) ? { lx: CX - 330, rx: CX + 330, y: 425, h: 300 } : c, outExpo(prog(t, h(1), 0.3)));
    drawChev(c, METHODS[id].fg);
    drawDia(0, 0, 0);
    return;
  }

  // ===== AI Rewrite: name, line, then a check on each hit =====
  if (t < h(23)) {
    show("AI"); st.style.background = "#000";
    const head = $("ai-head");
    const up = outExpo(prog(t, h(19), 0.35));
    head.style.top = lerp(300, 120, up) + "px";
    head.style.transform = `scale(${lerp(1, 0.5, up)})`;
    slam($("ai-title"), t, h(17));
    rise($("ai-sub"), t, h(18));
    [0, 1, 2].forEach((k) => slam($("ai-c" + k), t, h(19 + k), 1.4));
    const onName = around($("ai-title"), 50, 1.1);
    const onChecks = aroundWords([document.querySelector("#AI .m-checks")], 40, 1.1);
    let c = mix(onName, onChecks, outExpo(prog(t, h(19), 0.3)));
    if (t < h(17) + 0.3) { show("TF"); const prev = drawMethod("TF", h(17) - 0.001); show("AI"); c = mix(prev, c, outExpo(prog(t, h(17), 0.3))); }
    c = spring(c, kick(t, [h(17), h(18), h(19), h(20), h(21), h(22)]));
    drawChev(c, "#fff");
    drawDia(0, 0, 0);
    return;
  }

  // ===== results: "Up to" 69% "fewer" "tokens." then the three methods, one per hit =====
  if (t < h(32)) {
    show("RES"); st.style.background = LIGHT;
    rise($("s-w0"), t, h(23));
    slam($("s-w1"), t, h(24), 1.5);
    rise($("s-w2"), t, h(25));
    rise($("s-w3"), t, h(26));
    [0, 1, 2].forEach((k) => rise($("s-r" + k), t, h(28 + k)));
    let c = around($("s-w1"), 46, 0.9);
    if (t < h(24)) c = around($("s-w0"), 40, 1.6);
    if (t >= h(24) && t < h(24) + 0.3) c = mix(around($("s-w0"), 40, 1.6), c, outExpo(prog(t, h(24), 0.3)));
    if (t < h(23) + 0.3) { show("AI"); const prev = aroundWords([document.querySelector("#AI .m-checks")], 40, 1.1); show("RES"); c = mix(prev, c, outExpo(prog(t, h(23), 0.3))); }
    c = spring(c, kick(t, [h(23), h(24), h(25), h(26), h(27), h(28), h(29), h(30), h(31)]));
    drawChev(c, INK);
    drawDia(0, 0, 0);
    return;
  }

  // ===== the line, a word per hit; then it squeezes into the logo as the music stops =====
  if (t < HIT) {
    show("LINE"); st.style.background = "#000";
    const at = [h(32), h(33), h(35), h(36)];
    ["f-w0", "f-w1", "f-w2", "f-w3"].forEach((id, k) => slam($(id), t, at[k], 1.3));
    const close = inExpo(prog(t, STOP - 0.32, 0.32));
    ["f-l1", "f-l2"].forEach((id) => {
      const el = $(id);
      el.style.transform = `scale(${Math.max(0.001, 1 - close)}, 1)`;
      el.style.filter = close > 0 ? `blur(${close * 14}px)` : "none";
    });
    let c = aroundWords([$("f-l1"), $("f-l2")], 50, 1.0);
    if (t < h(32) + 0.3) { show("RES"); const prev = around($("s-w1"), 46, 0.9); show("LINE"); c = mix(prev, c, outExpo(prog(t, h(32), 0.3))); }
    c = spring(c, kick(t, [h(32), h(33), h(34), h(35), h(36), h(37), h(38), h(39)]));
    c = mix(c, markState(CX, CY, END_SIZE), close);
    drawChev(c, "#fff");
    const pop = outBack(prog(t, STOP - 0.03, 0.28));
    drawDia(CX, CY, 4.5 * END_SIZE / 64 * Math.max(0, pop), lerp(-90, 0, pop));
    return;
  }

  // ===== the final hit: the end card, then back into the mark =====
  show("G"); st.style.background = "#000";
  const word = $("g-word"), letters = word.querySelectorAll("span");
  const ww = GW, size = END_SIZE, u = size / 64, gapPx = 44;
  const markW = 2 * (7 + 19) * u, total = markW + gapPx + ww;
  const markX = CX - total / 2 + markW / 2, wordX = CX - total / 2 + markW + gapPx;
  const slide = outExpo(prog(t, HIT, 0.5)), close = inOut(prog(t, DUR - 0.65, 0.6));
  const x = lerp(lerp(CX, markX, slide), CX, close), sz = lerp(size, REST_SIZE, close);
  drawChev(markState(x, CY, sz), "#fff");
  drawDia(x, CY, 4.5 * sz / 64);
  word.style.left = wordX + "px";
  word.style.transform = `translateY(-52%)`;
  letters.forEach((l, i) => {
    const k = outExpo(prog(t, HIT + 0.04 + i * 0.035, 0.5));
    const sqz = inExpo(prog(t, DUR - 0.65 + (5 - i) * 0.02, 0.4));
    const toMark = (x - (wordX + i * (ww / 6))) * sqz;
    l.style.transform = `translateY(${(1 - k) * 60}px) translateX(${toMark}px) scaleX(${1 - 0.7 * sqz})`;
    l.style.opacity = clamp(k * 2) * (1 - sqz);
    l.style.filter = `blur(${(1 - k) * 12 + sqz * 10}px)`;
  });
  const tag = $("g-tag");
  const tk = outExpo(prog(t, HIT + 0.45, 0.6)), tq = inExpo(prog(t, DUR - 0.8, 0.3));
  tag.style.transform = `translateX(-50%) translateY(${(1 - tk) * 20}px)`;
  tag.style.opacity = tk * (1 - tq);
}

window.ready = (async () => {
  await document.fonts.ready;
  await document.fonts.load('800 100px "Inter"'); await document.fonts.load('700 100px "Inter"');
  await document.fonts.load('600 100px "Inter"'); await document.fonts.load('500 20px "JetBrains Mono"');
  build();
  render(0);
  return true;
})();
window.render = render;
</script>
