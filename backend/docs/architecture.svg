<rect width="1440" height="920" fill="#f5f7fa"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172d40">
<text x="60" y="65" font-size="34" font-weight="700">TokenSaver / System architecture</text>
<text x="60" y="100" font-size="18" fill="#526577">Local backend • replaceable frontend • bounded external compression</text>
